    <style>html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;background:#000;width:100%;height:100%;margin:0;padding:0;overflow:hidden}#game{background:#000;position:fixed;inset:0;overflow:hidden}#game canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;position:absolute}#fatal{z-index:1000;color:#fff;white-space:pre-wrap;background:#b00020;max-height:70%;padding:8px 10px;font:12px/1.35 Consolas,Menlo,monospace;display:none;position:fixed;top:0;left:0;right:0;overflow:auto}#fatal.on{display:block}#rotate{z-index:900;color:#e8e2cf;text-align:center;background:#0b0d18;flex-direction:column;justify-content:center;align-items:center;gap:18px;font-family:DotGothic16,monospace;font-size:20px;line-height:1.5;display:none;position:fixed;inset:0}#rotate .phone{border:4px solid #e8e2cf;border-radius:8px;width:46px;height:80px;animation:2.4s ease-in-out infinite tilt;position:relative}#rotate .phone:after{content:"";background:#e8e2cf;border-radius:2px;width:10px;height:4px;margin-left:-5px;position:absolute;bottom:5px;left:50%}@keyframes tilt{0%,30%{transform:rotate(0)}60%,to{transform:rotate(-90deg)}}body.freeze #rotate .phone{animation:none;transform:rotate(-45deg)}@media (orientation:portrait){#rotate{display:flex}}</style>
    <script>
      // Error overlay (carried from the M0 probe): installed before any module code so
      // module-load failures also show in-page as a red panel.
      (function () {
        function show(msg) {
          var el = document.getElementById('fatal');
          if (!el) { document.addEventListener('DOMContentLoaded', function () { show(msg); }); return; }
          el.textContent += (el.textContent ? '\n\n' : '') + msg;
          el.className = 'on';
          window.__gameErrors = (window.__gameErrors || 0) + 1;
        }
        window.__gameShowError = show;
        window.onerror = function (message, source, line, col, error) {
          show('ERROR: ' + message + '\n  at ' + source + ':' + line + ':' + col + (error && error.stack ? '\n' + error.stack : ''));
        };
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev.reason;
          show('UNHANDLED REJECTION: ' + (r && r.stack ? r.stack : String(r)));
        });
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-B_q_r47r.js"></script>

    </div>
    <div id="fatal" role="alert"></div>
