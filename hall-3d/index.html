<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Great Hall — 3D prototype</title>
    <style>html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:#000;height:100%;margin:0;font-family:-apple-system,system-ui,Segoe UI,sans-serif;overflow:hidden}#c{touch-action:none;width:100%;height:100%;display:block;position:fixed;inset:0}#touch{touch-action:none;position:fixed;inset:0}#stick-base,#stick-knob{pointer-events:none;border-radius:50%;transition:opacity .2s;position:fixed;top:0;left:0}#stick-base{opacity:.55;background:#14101e40;border:2px solid #ffecc859;width:120px;height:120px}#stick-base.active{opacity:1}#stick-knob{background:#ffecc873;width:52px;height:52px;box-shadow:0 0 12px #ffc87866}#hud{top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));gap:8px;display:flex;position:fixed}#hud button{color:#f6e7c8;touch-action:none;-webkit-backdrop-filter:blur(4px);background:#120e1c99;border:1px solid #f6e7c866;border-radius:10px;min-width:64px;padding:10px 14px;font:600 14px/1 -apple-system,system-ui,sans-serif}#hud button.on{background:#50468cbf}#fps{top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));color:#b9f5c0;pointer-events:none;background:#0000008c;border-radius:6px;padding:4px 8px;font:12px/1.3 ui-monospace,Menlo,monospace;display:none;position:fixed}#fps.on{display:block}#loading{color:#e9dcc0;background:#000;place-items:center;font-size:16px;transition:opacity .5s;display:grid;position:fixed;inset:0}#loading.off{opacity:0;pointer-events:none}#fatal{color:#fff;background:#600;border-radius:8px;padding:12px;font-size:14px;display:none;position:fixed;inset:20% 10% auto}#fatal.on{display:block}body.no-ui #hud,body.no-ui #stick-base,body.no-ui #stick-knob{display:none}</style>
    <script type="module" crossorigin src="./assets/index-DCXbWkZz.js"></script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="touch"></div>
    <div id="stick-base"></div>
    <div id="stick-knob"></div>
    <div id="hud">
      <button id="btn-view">View 1/4</button>
      <button id="btn-chars">3D</button>
      <button id="btn-sky">Sky</button>
    </div>
    <div id="fps"></div>
    <div id="loading">Loading the Great Hall…</div>
    <div id="fatal"></div>
  </body>
</html>
